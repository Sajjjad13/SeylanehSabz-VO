<!DOCTYPE html>
<html dir="rtl">

<head>

<meta charset="utf-8">

<title>پنل پیشنهاد سفارش مشتریان</title>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>

/* 🔥 فونت B Mitra */
@font-face {
    font-family: 'B Mitra';
    src: url('https://cdn.fontcdn.ir/Font/Persian/BMitra/BMitra.ttf');
}

body{
    font-family: 'B Mitra', tahoma;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    width:420px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* 🔥 لوگو */
.logo{
    display:block;
    margin:0 auto 20px auto;
    width:160px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    font-weight:normal;
}

/* فیلدها */
select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid #ddd;
    font-family:'BMitra', tahoma;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-family:'B Mitra', tahoma;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

</style>

</head>

<body>

<div class="card">

<!-- لوگو -->
<img class="logo"
     src="https://seylanehsabz.ir/fa/asset/theme-seylaneh/image/logo.png?1724315046" />

<!-- 🔥 عنوان جدید -->
<h2>پنل پیشنهاد سفارش مشتریان</h2>

<!-- لاین -->
<select id="line" onchange="loadRoutes()">

    <option value="">انتخاب لاین</option>

    {% for l in lines %}
        <option value="{{l}}">{{l}}</option>
    {% endfor %}

</select>


<!-- مسیر -->
<select id="route" onchange="loadCustomers()">

    <option value="">انتخاب مسیر</option>

</select>


<!-- مشتری -->
<select id="customer">

    <option value="">انتخاب مشتری</option>

</select>

<br>

<button onclick="goNext()">
    ادامه
</button>

</div>


<script>

function loadRoutes(){

    let line = document.getElementById("line").value;

    axios.get("/get_routes?line=" + line)

    .then(res => {

        let route = document.getElementById("route");

        route.innerHTML = "<option value=''>انتخاب مسیر</option>";

        res.data.forEach(r => {

            route.innerHTML +=
                `<option value="${r}">
                    ${r}
                </option>`;

        });

    });

}


function loadCustomers(){

    let route = document.getElementById("route").value;

    axios.get("/get_customers?route=" + route)

    .then(res => {

        let select = document.getElementById("customer");

        select.innerHTML = "<option value=''>انتخاب مشتری</option>";

        res.data.forEach(c => {

            select.innerHTML +=
                `<option value="${c['نام']}">
                    ${c['نام']}
                </option>`;

        });

    });

}


function goNext(){

    let customer = document.getElementById("customer").value;

    if(!customer){
        alert("مشتری را انتخاب کنید");
        return;
    }

    window.location.href =
        "/products?customer=" + customer;

}

</script>

</body>

</html>
