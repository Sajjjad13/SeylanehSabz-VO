<!DOCTYPE html>
<html dir="rtl">

<head>

<meta charset="utf-8">
<title>ثبت سفارش</title>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>

body{
    font-family:'BMitra',Tahoma;
    background:#f5f6fa;
    margin:20px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.customer-title{
    font-size:28px;
    font-weight:bold;
}

.clear-btn{
    border:none;
    background:none;
    font-size:30px;
    cursor:pointer;
}

.brand-section{
    background:white;
    border-radius:12px;
    margin-bottom:25px;
    padding:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.brand-row{
    display:flex;
    flex-direction:row;
    gap:15px;
    align-items:flex-start;
}

.products-container{
    flex:1;
    display:grid;
    grid-template-columns:repeat(15, 1fr);
    gap:6px;
}

.product-card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:4px;
    text-align:center;
    background:white;
}

.product-card img{
    width:100%;
    height:70px;
    object-fit:contain;
}

.qty-input{
    width:100%;
    height:24px;
    font-size:12px;
    text-align:center;
    margin-top:4px;
    border:1px solid #ccc;
    border-radius:4px;
}

.brand-logo{
    width:160px;
    min-width:160px;
    text-align:center;
}

.brand-logo img{
    max-width:150px;
    max-height:80px;
    object-fit:contain;
}

.total-box{
    position:sticky;
    bottom:0;
    background:white;
    padding:15px;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    border-top:3px solid #198754;
    margin-top:20px;
}

.target-box{
    margin-top:8px;
    font-size:18px;
}

.diff{
    margin-top:5px;
    font-size:18px;
}

.green{ color:green; }
.red{ color:red; }

.submit-btn{
    width:100%;
    padding:15px;
    border:none;
    background:#198754;
    color:white;
    font-size:20px;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="customer-title">
        مشتری: {{customer}}
    </div>

    <button class="clear-btn" onclick="clearAll()">🗑️</button>

</div>


{% for brand, products in grouped_products.items() %}

<div class="brand-section">

    <div class="brand-row">

        <div class="products-container">

            {% for p in products %}

            <div class="product-card">

                <img src="{{p['عکس محصول']}}">

                <input
                    type="number"
                    min="0"
                    value="0"
                    class="qty-input"
                    data-title="{{p['عنوان محصول']}}"
                    data-price="{{p['قیمت']}}"
                    oninput="calcTotal()"
                >

            </div>

            {% endfor %}

        </div>

        <div class="brand-logo">
            <img src="{{products[0]['عکس برند']}}">
        </div>

    </div>

</div>

{% endfor %}


<div class="total-box">

    جمع کل سفارش:
    <span id="total">0</span>

    <div class="target-box">
        تارگت:
        <span id="target">{{ "{:,.0f}".format(target) }}</span>
    </div>

    <div class="diff" id="diff"></div>

</div>


<button class="submit-btn" onclick="submitOrder()">
    ثبت سفارش
</button>


<script>

function calcTotal(){

    let total = 0;

    document.querySelectorAll(".qty-input").forEach(i => {

        let qty = Number(i.value) || 0;
        let price = Number(i.dataset.price) || 0;

        total += qty * price;

    });

    document.getElementById("total").innerText =
        total.toLocaleString();

    let target = Number(document.getElementById("target").innerText.replace(/,/g,'') || 0);

    let diff = target - total;

    let diffBox = document.getElementById("diff");

    if(total >= target){
        diffBox.innerHTML = "تارگت پوشش داده شد";
        diffBox.className = "diff green";
    } else {
        diffBox.innerHTML = "اختلاف: " + diff.toLocaleString();
        diffBox.className = "diff red";
    }
}


function clearAll(){
    document.querySelectorAll(".qty-input").forEach(i => i.value = 0);
    calcTotal();
}


function submitOrder(){

    let items = [];

    document.querySelectorAll(".qty-input").forEach(i => {

        let qty = Number(i.value || 0);

        if(qty > 0){
            items.push({
                title: i.dataset.title,
                qty: qty,
                price: Number(i.dataset.price)
            });
        }

    });

    if(items.length === 0){
        alert("هیچ محصولی انتخاب نشده");
        return;
    }

    fetch("/submit", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            customer: "{{customer}}",
            items: items
        })
    })
    .then(async res => {

        let data = await res.json();

        if(!res.ok){
            alert("خطا: " + (data.message || "server error"));
            return;
        }

        alert("ثبت سفارش انجام شد ✔\nجمع کل: " + Number(data.total).toLocaleString());

        // برگشت به صفحه اول (مهم‌ترین fix)
        window.location.href = "/";

    })
    .catch(err => {
        console.log(err);
        alert("خطا در ارتباط با سرور");
    });

}

</script>

</body>
</html>
